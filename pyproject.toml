[project]
name = "myhandy"
version = "0.1.0"
description = "Voice-controlled input using ONNX-based speech recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "onnx-asr[cpu,hub]>=0.11.0",
    "pyperclip>=1.8.0",
    "evdev>=1.0.0; sys_platform == 'linux'",
    "pyautogui>=0.9.0; sys_platform == 'win32' or sys_platform == 'darwin'",
    "python-dotenv>=1.0.0",
]
